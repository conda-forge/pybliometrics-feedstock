schema_version: 1

context:
  name: pybliometrics
  version: "4.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pybliometrics-${{ version }}.tar.gz
  sha256: 357e54edb3d1bf9dbae6d3c33c1a1e574c1a496fa2b9886d32503bad6d1459bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.2
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - requests
    - tqdm
    - urllib3

tests:
  - python:
      imports:
        - pybliometrics
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python-based API-Wrapper to access Scopus
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pybliometrics-dev/pybliometrics

extra:
  recipe-maintainers:
    - jan-janssen
